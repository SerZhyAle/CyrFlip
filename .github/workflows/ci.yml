name: CI

on:
  # Between releases nothing slower than 5 seconds runs (S0081, TESTING_AND_QA section 2), and this job
  # is a full solution build plus the whole unit suite - so it no longer runs on a push or a pull request.
  # It runs only when the owner names it (Actions -> CI -> Run workflow). The release runs the same build
  # and suite against the tag's own tree: release.ps1 (the preflight, which also builds IconGen) and
  # release.yml (after the tag).
  workflow_dispatch:

# A second dispatch on the same ref cancels the previous still-running CI run, so a burst
# of dispatches costs one active run instead of N parallel Windows runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    # Started by hand only (see the trigger above); the release commit and the tag never reach it.
    # net48 unit tests need real Windows (Mono is unreliable for WinForms/P-Invoke
    # assemblies) — so the runner stays Windows; savings come from the NuGet cache below.
    runs-on: windows-latest
    timeout-minutes: 15            # guard against a hung job (a normal run is < 5 min)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '8.0.x'

      # Cache the global NuGet package folder. Keyed on every .csproj/.sln hash, so the
      # cache invalidates only when dependencies actually change. Uses actions/cache
      # directly (setup-dotnet's cache:true needs a packages.lock.json, which this repo
      # doesn't have). The restore-keys line lets a partially-stale cache still hit.
      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.sln') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore CyrFlip.sln

      - name: Build (Release)
        run: dotnet build CyrFlip.sln -c Release --no-restore

      - name: Test
        shell: pwsh
        # The 13-language UI sweeps do not run here (tests/CyrFlip.Tests/UiSweepGate.cs: only
        # CYRFLIP_SWEEP=full sweeps, and nothing sets it), so they report as skipped.
        # The TRX count check fails a run that discovered nothing, which exits 0 (S0029 RB-6).
        run: |
          dotnet test CyrFlip.sln -c Release --no-build --verbosity normal --logger trx --results-directory TestResults
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/Assert-TestRun.ps1 -ResultsDirectory TestResults -AllowSkipped

      - name: Build IconGen
        run: dotnet build tools/IconGen --configuration Release
