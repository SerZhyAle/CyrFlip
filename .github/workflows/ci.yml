name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore CyrFlip.sln

      - name: Build (Release)
        run: dotnet build CyrFlip.sln -c Release --no-restore

      - name: Test
        run: dotnet test CyrFlip.sln -c Release --no-build --verbosity normal
