name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v26.6.11.1700)'
        required: true

permissions:
  contents: write

env:
  # This is the single source of truth for both tag-triggered and manually dispatched releases.
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

# Serialise per-tag so a push + a manual dispatch of the same tag can't run twice.
# cancel-in-progress is FALSE on purpose: releases for different tags must NOT cancel
# each other, and a half-finished release should never be aborted by a later one.
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    # Must be Windows: Authenticode signing uses signtool.exe from the Windows SDK.
    runs-on: windows-latest
    timeout-minutes: 25            # sign + package take longer than CI — give extra headroom
    # Expose only a boolean outside the signing step. The certificate and password must never be
    # available to checkout, cache, MSBuild, test code, or a third-party release action.
    env:
      SIGNING_ENABLED: ${{ secrets.SIGNING_CERT_BASE64 != '' }}
    defaults:
      run:
        shell: pwsh
    steps:
      # A manual dispatch names the tag to release; check that tag out, not the branch head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      # Same NuGet cache key as CI — the two workflows share one cache, so a release
      # right after a green CI run restores packages instead of re-downloading them.
      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.sln') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Resolve version from tag
        id: ver
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:RELEASE_TAG
          $version = $tag -replace '^v',''
          # Same tag-shape gate as release.ps1: a mistyped dispatch input fails here, before a build.
          # No leading zero in month/day: the SDK normalizes '09' to '9', so the tag would never match the exe.
          if ($version -notmatch '^\d{2}\.(?:[1-9]|1[0-2])\.(?:[1-9]|[12]\d|3[01])\.\d{4}$') { throw "Tag '$tag' is not vYY.M.D.HHmm." }
          # A real date and time, and newer than every other release tag - release.ps1's two gates
          # (S0038 RP-6): winget and the Store refuse a version that is not an upgrade.
          try { [datetime]::ParseExact($version, 'yy.M.d.HHmm', [Globalization.CultureInfo]::InvariantCulture) | Out-Null }
          catch { throw "Tag '$tag' does not parse as a real YY.M.D.HHmm date and time." }
          foreach ($other in @(git tag --list 'v*')) {
            if ($other -eq $tag -or $other -notmatch '^v(\d{2}\.(?:[1-9]|1[0-2])\.(?:[1-9]|[12]\d|3[01])\.\d{4})$') { continue }
            if ([version]$Matches[1] -ge [version]$version) { throw "Tag '$tag' is not newer than '$other'." }
          }
          # A published tag is never rebuilt (S0038 RP-1): Compress-Archive stamps fresh file times,
          # so a re-run makes a ZIP with other bytes, and replacing the asset and its .sha256 breaks
          # the hash in every winget manifest already merged for this version.
          $assets = gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name' 2>&1
          if ($LASTEXITCODE -eq 0) {
            if (@($assets | Where-Object { $_ -like 'CyrFlip-*.zip' }).Count -gt 0) {
              throw "Release $tag already carries its ZIP - a published release is never rebuilt. Cut a new tag."
            }
          }
          elseif (-not ("$assets" -match 'release not found')) { throw "Could not ask GitHub about release ${tag}: $assets" }
          $global:LASTEXITCODE = 0
          $tagCommit = (git rev-parse "refs/tags/$tag^{commit}").Trim()
          $commit = (git rev-parse HEAD).Trim()
          if ($tagCommit -ne $commit) { throw "Checked-out commit $commit does not match tag $tag ($tagCommit)." }
          git fetch --no-tags "https://x-access-token:$env:GITHUB_TOKEN@github.com/$env:GITHUB_REPOSITORY.git" main:refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw "Could not fetch origin/main (exit $LASTEXITCODE)." }
          git merge-base --is-ancestor $tagCommit origin/main
          if ($LASTEXITCODE -ne 0) { throw "Tag $tag commit $tagCommit is not reachable from origin/main." }
          "tag=$tag"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "commit=$commit"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Tag=$tag  Version=$version"

      # Pin the embedded exe version to the tag (-p:Version), so the FileVersion inside the
      # exe matches the ZIP/release name exactly. Without this the csproj stamps build-time
      # YY.M.D.HHmm, which drifts from the tag minute.
      - name: Build (Release)
        run: dotnet build CyrFlip.sln -c Release -p:Version=${{ steps.ver.outputs.version }}

      # BUILD-EVIDENCE rule 2: the artefact carries the version of the build that produced it.
      # FileVersion must equal the tag, and the SDK-embedded revision in ProductVersion must be the
      # commit this run checked out - that catches a stale exe and a mislabeled one alike.
      - name: Verify exe version (release-version-step)
        run: |
          $vi = (Get-Item src/CyrFlip/bin/Release/net48/CyrFlip.exe).VersionInfo
          $want = '${{ steps.ver.outputs.version }}'; $commit = '${{ steps.ver.outputs.commit }}'
          Write-Host "exe FileVersion=$($vi.FileVersion) ProductVersion=$($vi.ProductVersion)"
          # Compared as [version], not as strings: the SDK normalizes HHmm '0152' to '152' in FileVersion.
          if ([version]$vi.FileVersion -ne [version]$want) { throw "exe FileVersion '$($vi.FileVersion)' is not the tag version '$want'." }
          if ($vi.ProductVersion -ne "$want+$commit") { throw "exe ProductVersion '$($vi.ProductVersion)' is not '$want+$commit'." }

      # CI already runs the full suite on every push/PR to main before a tag is cut, so
      # this is a safety re-test of the exact tagged commit. Keep it — a release is rare
      # and high-stakes, and tags can be pushed without first passing through a PR.
      - name: Test
        shell: pwsh
        # The TRX count check fails a run that discovered nothing, which exits 0 (S0029 RB-6).
        run: |
          dotnet test CyrFlip.sln -c Release --no-build --logger trx --results-directory TestResults
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/Assert-TestRun.ps1 -ResultsDirectory TestResults

      # Authenticode-sign the exe BEFORE staging so the zipped/hashed artefact is the signed one.
      # Runs only when a signing certificate is configured (secrets SIGNING_CERT_BASE64 +
      # SIGNING_CERT_PASSWORD). Without them the step is skipped and the release ships unsigned.
      - name: Sign CyrFlip.exe (Authenticode)
        if: env.SIGNING_ENABLED == 'true'
        env:
          SIGN_CERT_BASE64: ${{ secrets.SIGNING_CERT_BASE64 }}
          SIGN_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          $exe = "src/CyrFlip/bin/Release/net48/CyrFlip.exe"
          if (-not (Test-Path $exe)) { throw "CyrFlip.exe not found at $exe" }

          # Decode the PFX from the base64 secret to a temp file, sign, then delete it.
          $pfx = Join-Path $env:RUNNER_TEMP 'cyrflip-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_CERT_BASE64))

          # Locate the newest signtool.exe from the installed Windows SDK (not on PATH by default).
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found (Windows SDK missing).' }

          try {
            & $signtool.FullName sign `
              /f $pfx /p $env:SIGN_CERT_PASSWORD `
              /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
              /d 'CyrFlip' /du 'https://github.com/SerZhyAle/CyrFlip' `
              $exe
            if ($LASTEXITCODE -ne 0) { throw "signtool sign failed (exit $LASTEXITCODE)." }

            & $signtool.FullName verify /pa /v $exe
            if ($LASTEXITCODE -ne 0) { throw "signature verification failed (exit $LASTEXITCODE)." }
            Write-Host 'CyrFlip.exe signed and verified.'
          }
          finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Stage release files
        id: stage
        run: |
          $version = '${{ steps.ver.outputs.version }}'
          $stage = "stage/CyrFlip-$version-windows-x64"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null

          $out = "src/CyrFlip/bin/Release/net48"
          if (-not (Test-Path "$out/CyrFlip.exe")) { throw "CyrFlip.exe not found in $out" }

          # Single-file app: ship the exe + config.json, drop debug/doc artefacts.
          Get-ChildItem $out -File |
            Where-Object { $_.Extension -notin '.pdb','.xml' } |
            ForEach-Object { Copy-Item $_.FullName $stage }
          if (Test-Path README.md) { Copy-Item README.md $stage }
          if (Test-Path LICENSE)   { Copy-Item LICENSE   $stage }
          # The Apache-2.0 notice for the vendored Material Icons glyphs (ICON-EXTERNAL rule 5) ships
          # next to the exe, so its absence is a failed release, not a quiet omission.
          if (-not (Test-Path THIRD-PARTY-NOTICES.md)) { throw "THIRD-PARTY-NOTICES.md is missing from the repository root." }
          Copy-Item THIRD-PARTY-NOTICES.md $stage

          "stage=$stage" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Get-ChildItem $stage | Format-Table -AutoSize

      - name: Package zip + SHA256
        id: pkg
        run: |
          $version = '${{ steps.ver.outputs.version }}'
          $stage   = '${{ steps.stage.outputs.stage }}'
          $name    = "CyrFlip-$version-windows-x64.zip"
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $zip = "dist/$name"

          Compress-Archive -Path "$stage/*" -DestinationPath $zip -Force

          # The same version check on the exe that actually ships - the one inside the ZIP.
          $probe = Join-Path $env:RUNNER_TEMP 'zip-probe'
          Expand-Archive -Path $zip -DestinationPath $probe -Force
          $vi = (Get-Item (Join-Path $probe 'CyrFlip.exe')).VersionInfo
          if ([version]$vi.FileVersion -ne [version]$version -or $vi.ProductVersion -ne "$version+${{ steps.ver.outputs.commit }}") {
            throw "exe inside the ZIP is $($vi.FileVersion) / $($vi.ProductVersion), expected $version+${{ steps.ver.outputs.commit }}."
          }
          Remove-Item $probe -Recurse -Force

          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash
          "$hash  $name" | Out-File -FilePath "$zip.sha256" -Encoding ascii

          "name=$name"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Package: $name"
          Write-Host "SHA256:  $hash  (use this to update winget/ manifests)"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: CyrFlip ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          # The second guard of RP-1: a publish that meets an asset of the same name fails instead of
          # replacing the ZIP and the .sha256 that winget manifests already point at.
          overwrite_files: false
          files: |
            dist/*.zip
            dist/*.sha256
