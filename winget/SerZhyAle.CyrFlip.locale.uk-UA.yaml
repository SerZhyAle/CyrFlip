ShortDescription: Живий індикатор розкладки біля каретки та перетворення тексту між будь-якими двома встановленими розкладками.
Description: >-
  CyrFlip - крихітна утиліта в треї для Windows. Вона показує активну розкладку просто біля
  миготливої каретки, а також на текстовому курсорі миші та на значку в треї, тож ви завжди
  знаєте, якою розкладкою друкуєте: кожна з 13 популярних мов має власний колір, а за
  увімкненого CapsLock з'являється рамка. Гаряча клавіша транслітерує виділення між QWERTY та
  ЙЦУКЕН на місці, друга виправляє випадковий CapsLock, а таблиця пар розкладок додає скільки
  завгодно перетворень "з розкладки в розкладку" - кожне з власним сполученням і в обидва боки.
  Вікно налаштувань замінює розділ мов Windows: встановлення, порядок і видалення розкладок,
  сполучення перемикання та прямі сполучення на мову, які обробляє сама Windows. Необов'язковий
  модуль "Швидкий запуск" перетворює ваші програми, скрипти та завантаження yt-dlp на сценарії,
  які запускаються з трея, за власним глобальним сполученням або з Jump List панелі завдань.
  Вбудований перекладач, теж необов'язковий, надсилає виділення до Ollama - безкоштовної програми,
  яку ви окремо встановлюєте на свій комп'ютер, - і показує переклад у маленькому вікні біля
  курсора миші; типово він вимкнений і звертається лише до localhost, тож текст не покидає вашу
  машину. Додатково: необов'язкова історія буфера з пошуком і шифруванням DPAPI, два перемикачі
  "не давати засинати" та інтерфейс 13 мовами. Один портативний exe, без інсталятора та
  залежностей.
ReleaseNotes: |-
  - Вбудований перекладач, необов'язковий і вимкнений, доки ви його не ввімкнете: виділіть текст, натисніть своє сполучення, і переклад з'являтиметься в невеликому вікні біля вказівника миші.
  - Працює на Ollama - безкоштовній програмі, яку ви один раз встановлюєте собі самі, тому виділений текст іде на вашу ж машину, а не в хмару й не розробникові.
  - Напрямки перекладу - відкрита таблиця: рядок це мова з власним сполученням, і рядок може стежити за мовою інтерфейсу або за розкладкою активного вікна.
  - Результат за бажанням кладеться в буфер обміну, де його зберігає необов'язкова історія, або одразу замінює виділення - обидві опції типово вимкнені.
  - На вкладці "Переклад" Ollama встановлюється, запускається, перевіряється й отримує модель - по одній кнопці на дію; рекомендовані моделі від ~1,6 ГБ.
  - У версії з Microsoft Store кнопка встановлення відкриває сайт ollama.com, а не завантажує інсталятор сама.
