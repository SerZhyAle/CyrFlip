ShortDescription: "Набір інструментів у треї для клавіатури та робочого столу: розкладка біля каретки, виправлення тексту в хибній розкладці, знімок екрана й модулі для тексту."
Description: >-
  CyrFlip - набір інструментів у треї для клавіатури та робочого столу Windows. Одразу після запуску
  він показує активну розкладку просто біля миготливої каретки, а також на текстовому курсорі миші
  та на значку в треї: кожна з 13 популярних мов має власний колір, а за увімкненого CapsLock
  з'являється рамка; гаряча клавіша виправляє виділення, набране в хибній розкладці, на місці й в
  обидва боки. Таблиця пар розкладок додає скільки завгодно перетворень "з розкладки в розкладку" з
  власним сполученням кожне, друга клавіша виправляє випадковий CapsLock, а вікно налаштувань
  замінює розділ мов Windows: встановлення, порядок і видалення розкладок, сполучення перемикання та
  прямі сполучення на мову, які обробляє сама Windows. Ctrl+F12 кладе будь-яку область
  екрана в буфер обміну. Решта - необов'язкові модулі, вимкнені, доки ви їх не ввімкнете: власне
  меню над виділенням за Ctrl і правим кліком; перекладач, що надсилає виділення до Ollama -
  безкоштовної програми, яку ви окремо встановлюєте на свій комп'ютер, - і показує переклад у
  маленькому вікні біля курсора миші, типово звертаючись лише до localhost, тож текст не покидає
  вашу машину; необов'язкове вікно символів, що знаходить потрібний знак за назвою, ключовим словом
  або кодом Unicode і копіює його кліком; історія буфера з пошуком і шифруванням DPAPI; локальні
  зашифровані швидкі нотатки,
  які зберігають код рівно таким, яким його набрали; відкритий текстовий файл обміну, що переносить
  нотатки й історію на інший комп'ютер; і "Швидкий запуск", який перетворює ваші програми, скрипти
  та завантаження yt-dlp на сценарії із запуском з трея, за власним глобальним сполученням або з
  Jump List панелі завдань. Додатково: усі гарячі клавіші в одному списку налаштувань із поверненням
  будь-якої до початкової, два перемикачі "не давати засинати", світла або темна тема,
  інтерфейс 13 мовами та кнопка "Надіслати логи автору..", яка збирає логи CyrFlip в один архів для
  листа - надсилаєте його ви самі. Один портативний exe, без інсталятора та залежностей.
ReleaseNotes: |-
  У цьому випуску з'явилися світлофор доступності, малювання на знімках екрана та налаштування, що переживають перевстановлення.
  - Світлофор доступності (типово вимкнений): перелічіть власні адреси, теки, диски та сервери, і невелика панель поверх вікон покаже, які з них відповідають просто зараз; у кожного стану є не лише колір, а й значок.
  - Знімки екрана: Ctrl+F11 знімає весь екран; Ctrl+Alt+F12 і Ctrl+Alt+F11 спершу відкривають малювання (еліпси, прямокутники, лінії, стрілки, гумка, вісім кольорів) і лише потім копіюють зображення. На нових установках знімки зберігаються в PNG у теку «Знімки екрана», а Ctrl+F10 відкриває її.
  - Нові типові сполучення: Ctrl+F12 для знімка області та Ctrl+F10 для теки зі знімками (PrintScreen більше не використовується). Установки зі старими типовими сполученнями один раз переносяться на нові; задані вами вручну лишаються як є.
  - Налаштування переживають оновлення й перевстановлення: файл налаштувань містить усе - сполучення, таблиці, сценарії «Швидкого запуску», цілі світлофора, а три останні копії зберігаються в Documents\CyrFlip\Backups, і на чистій установці пропонується їх відновити.
  - Буфер обміну на вашому сервері обміну (типово вимкнений): надсилайте текст, зображення або один файл на інші свої пристрої; дані шифруються на вашому комп'ютері й ідуть лише після натискання кнопки.
  - Довідка: F1 або кнопка «?» у кожному вікні та пункт «Довідка» в меню трею, сторінки зі знімками екрана 13 мовами.
  - Швидкі нотатки вміють показувати номери рядків (типово вимкнено).
