ShortDescription: "Набор инструментов в трее для клавиатуры и рабочего стола: раскладка у каретки, исправление текста в неверной раскладке, снимок экрана и модули для текста."
Description: >-
  CyrFlip - набор инструментов в трее для клавиатуры и рабочего стола Windows. Сразу после запуска
  он показывает активную раскладку прямо рядом с мигающей кареткой, а также на текстовом курсоре
  мыши и на значке в трее: у каждого из 13 популярных языков свой цвет, а при включённом CapsLock
  появляется рамка; горячая клавиша исправляет выделение, набранное в неверной раскладке, на месте и
  в обе стороны. Таблица пар раскладок добавляет сколько угодно конвертаций "из раскладки в
  раскладку" со своей комбинацией каждая, вторая клавиша исправляет случайный CapsLock, а окно
  настроек заменяет раздел языков Windows: установка, порядок и удаление раскладок, сочетание
  переключения и прямые сочетания на язык, которые обрабатывает сама Windows. Ctrl+F12
  кладёт любую область экрана в буфер обмена. Остальное - необязательные модули, выключенные, пока
  вы их не включите: собственное меню над выделением по Ctrl и правому клику; переводчик, который
  отправляет выделение в Ollama - бесплатную программу, которую вы отдельно ставите на свой
  компьютер, - и показывает перевод в маленьком окне у курсора мыши, по умолчанию обращаясь только к
  localhost, поэтому текст не покидает вашу машину; необязательное окно символов, которое находит
  нужный знак по названию, ключевому слову или коду Unicode и копирует его кликом; история буфера
  с поиском и шифрованием DPAPI;
  локальные зашифрованные быстрые заметки, которые хранят код ровно таким, каким его набрали;
  открытый текстовый файл обмена, переносящий заметки и историю на другой компьютер; и "Быстрый
  запуск", который превращает ваши программы, скрипты и загрузки yt-dlp в сценарии с запуском из
  трея, по собственной глобальной комбинации или из Jump List панели задач. Дополнительно: все
  горячие клавиши в одном списке настроек с возвратом любой к исходной, два
  переключателя "не давать засыпать", светлая или тёмная тема, интерфейс на 13 языках и кнопка
  "Отправить логи автору..", которая собирает логи CyrFlip в один архив для письма - отправляете его
  вы сами. Один портативный exe, без установщика и без зависимостей.
ReleaseNotes: |-
  В этом выпуске появились светофор доступности, рисование на снимках экрана и настройки, переживающие переустановку.
  - Светофор доступности (по умолчанию выключен): перечислите свои адреса, папки, диски и серверы, и небольшая панель поверх окон покажет, какие из них отвечают прямо сейчас; у каждого состояния есть не только цвет, но и значок.
  - Снимки экрана: Ctrl+F11 снимает весь экран; Ctrl+Alt+F12 и Ctrl+Alt+F11 сначала открывают рисование (эллипсы, прямоугольники, линии, стрелки, ластик, восемь цветов) и только потом копируют картинку. На новых установках снимки сохраняются в PNG в папку «Снимки экрана», а Ctrl+F10 открывает её.
  - Новые комбинации по умолчанию: Ctrl+F12 для снимка области и Ctrl+F10 для папки со снимками (PrintScreen больше не используется). Установки со старыми комбинациями по умолчанию один раз переносятся на новые; заданные вами вручную остаются как есть.
  - Настройки переживают обновление и переустановку: файл настроек содержит всё - комбинации, таблицы, сценарии «Быстрого запуска», цели светофора, а три последние копии хранятся в Documents\CyrFlip\Backups, и на чистой установке предлагается их восстановить.
  - Буфер обмена на вашем сервере обмена (по умолчанию выключен): отправляйте текст, картинку или один файл на другие свои устройства; данные шифруются на вашем компьютере и уходят только по нажатию кнопки.
  - Справка: F1 или кнопка «?» в каждом окне и пункт «Справка» в меню трея, страницы со снимками экрана на 13 языках.
  - Быстрые заметки умеют показывать номера строк (по умолчанию выключено).
