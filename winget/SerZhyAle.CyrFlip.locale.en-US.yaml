ShortDescription: "A tray toolkit for your keyboard and desktop: the live layout at the caret, one-key fixes for wrong-layout text, screen capture and optional text tools."
Description: >-
  CyrFlip is a tray toolkit for your keyboard and desktop on Windows. Out of the box it shows the
  active keyboard layout right next to the blinking text caret - on the mouse I-beam and the tray
  icon too - with its own colour for each of the 13 curated languages and a frame when CapsLock is
  on, and a hotkey fixes a selection typed in the wrong layout, in place and in both directions. A
  table of layout pairs adds as many "from layout to layout" conversions as you need, each with its
  own chord, a second hotkey fixes an accidental CapsLock, and a settings window replaces the
  Windows language pane: install, reorder and remove keyboard layouts, choose the switch chord, and
  assign per-language shortcuts that Windows itself handles. Ctrl+F12 puts any screen
  region on the clipboard. The rest are optional modules, off until you switch them on: CyrFlip's
  own menu over a selection, opened by Ctrl and a right click; a translator that sends a selection
  to Ollama - a free program you install separately on your own computer - and shows the translation
  in a small window at the mouse pointer, talking only to localhost by default, so no text leaves
  your machine; a symbols window that finds the character your keyboard lacks by name, keyword or
  Unicode code and copies it with a click; a DPAPI-encrypted clipboard history with search; local
  encrypted quick notes that
  keep code exactly as typed; a plain-text exchange file that moves notes and history to another
  computer; and Quick launch, which turns your programs, scripts and yt-dlp downloads into scenarios
  started from the tray, a global hotkey of their own or the taskbar Jump List. Extras: every hotkey
  in one Settings list with a reset to its default, two
  keep-awake switches, a light or dark theme, an interface in 13 languages, and a Send logs to the
  author button that packs CyrFlip's own logs into one archive for a report you send yourself. Ships
  as a single portable exe with no installer and no runtime dependencies.
ReleaseNotes: |-
  This release adds the traffic light, drawing on screenshots and settings that survive a reinstall.
  - Traffic light (off by default): list your own addresses, folders, drives and servers, and a small always-on-top board shows which of them answer right now - every state has a mark as well as a colour.
  - Screenshots: Ctrl+F11 takes the whole screen; Ctrl+Alt+F12 and Ctrl+Alt+F11 open a drawing step (ellipses, rectangles, lines, arrows, an eraser, eight colours) before the picture is copied. New installs save captures as PNG files in the Screenshots folder, and Ctrl+F10 opens it.
  - New default chords: Ctrl+F12 for the region capture and Ctrl+F10 for the capture folder (PrintScreen is no longer used). Installs that still had the old defaults are moved once; chords you set yourself stay as they are.
  - Settings survive an update or a reinstall: the settings file carries everything - chords, tables, Quick launch scenarios, traffic-light targets - and the last three backups are kept in Documents\CyrFlip\Backups, with an offer to restore them on a fresh install.
  - Clipboard on your own exchange server (off by default): send text, a picture or one file to your other devices, encrypted on your computer first and sent only when you press the button.
  - Help: F1 or the ? button on every window and Help in the tray menu, with pages and screenshots in 13 languages.
  - Quick notes can show line numbers (off by default).
ReleaseNotesUrl: https://github.com/SerZhyAle/CyrFlip/releases/latest
